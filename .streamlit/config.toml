# Tema do app: escuro, para uso em plantão (paleta de ferramenta de operações).
# Contraste conferido em scripts de verificação: texto 4.5:1 ou mais (AA).

[theme]
base = "dark"
primaryColor = "#15803D"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
linkColor = "#4ADE80"
borderColor = "#334155"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#111827"
baseFontSize = 16

[theme.sidebar]
backgroundColor = "#111827"
secondaryBackgroundColor = "#1E293B"

[client]
toolbarMode = "minimal"
